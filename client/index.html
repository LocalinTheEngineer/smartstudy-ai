    <script>
      // Sayfa daha React yuklenmeden dogru temayi (acik/koyu) uygular,
      // boylece once yanlis renkte acilip sonra "zipleme" olmaz.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage/matchMedia erisilemezse varsayilan (acik) tema kalir
        }
      })();
    </script>
